let idx=0,answers=[],tot=[0,0,0,0,0,0]; const $=s=>document.querySelector(s);

function draw(v){let c=$('#radar'),x=c.getContext('2d'),cx=280,cy=235,r=155;x.clearRect(0,0,c.width,c.height);x.font='18px Songti SC';x.textAlign='center';for(let ring=1;ring<=5;ring++){x.beginPath();for(let i=0;i<6;i++){let a=-Math.PI/2+i*Math.PI/3,rr=r*ring/5,px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.strokeStyle='#d7d0c5';x.stroke()}for(let i=0;i<6;i++){let a=-Math.PI/2+i*Math.PI/3;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.strokeStyle='#ddd6ca';x.stroke();x.fillStyle='#5e5851';x.fillText(dims[i],cx+Math.cos(a)*(r+36),cy+Math.sin(a)*(r+30)+6)}x.beginPath();v.forEach((n,i)=>{let a=-Math.PI/2+i*Math.PI/3,rr=r*n/100,px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fillStyle='rgba(150,45,56,.17)';x.fill();x.strokeStyle='#962d38';x.lineWidth=3;x.stroke()}
